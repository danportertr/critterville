<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Critterville</title>
<meta name="description" content="A tiny town of little guys who walk around and do things. Leave it running.">
<meta property="og:title" content="Critterville">
<meta property="og:description" content="A tiny town of little guys who walk around and do things. Leave it running.">
<meta property="og:image" content="assets/critter.png">
<link rel="icon" type="image/png" href="assets/critter.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c" aria-label="Critterville: a little town of critters going about their day"></canvas>
<div id="hud"><h1>Critterville</h1><div id="stats"></div></div>
<div id="log" aria-live="polite"></div>
<div id="hint">tap a critter to say hi &nbsp;·&nbsp; tap the ground to drop a snack</div>
<button id="journal-btn" title="The town's diary and fish book">journal</button>
<div id="journal" role="dialog" aria-label="Town journal" hidden>
  <div class="tabs">
    <button data-tab="diary">diary</button>
    <button data-tab="fish">fish book</button>
    <button id="journal-close" aria-label="Close journal">close</button>
  </div>
  <div id="journal-body"></div>
</div>
<div id="radio"><button id="radio-next" title="Next station" aria-label="Next station" hidden>next</button><button id="radio-toggle" title="Lofi radio" aria-pressed="false">♪ radio</button></div>
<button id="reset" title="Start over with a brand new town">new town</button>
<script type="module" src="src/main.js"></script>
</body>
</html>
